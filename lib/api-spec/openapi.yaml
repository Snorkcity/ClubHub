components:
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: integer
    CycleId:
      name: cycleId
      in: path
      required: true
      schema: { type: integer }
    PlayerId:
      name: playerId
      in: path
      required: true
      schema: { type: integer }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: integer }
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: integer
    GuardianshipId:
      name: guardianshipId
      in: path
      required: true
      schema:
        type: integer
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: integer

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Notification:
      type: object
      required: [id, kind, title, body, deepLink, createdAt, readAt, unread]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [event, post] }
        title: { type: string }
        body: { type: string }
        deepLink: { type: string }
        createdAt: { type: string }
        readAt: { type: ["string", "null"] }
        unread: { type: boolean }
    NotificationList:
      type: object
      required: [unreadCount, hasMore, nextCursor, notifications]
      properties:
        unreadCount: { type: integer }
        hasMore: { type: boolean }
        nextCursor: { type: ["integer", "null"] }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
    PushConfig:
      type: object
      required: [enabled, publicKey]
      properties:
        enabled: { type: boolean }
        publicKey: { type: ["string", "null"] }
    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, minLength: 1 }
        contentEncoding: { type: string }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 1 }
            auth: { type: string, minLength: 1 }
    PushSubscriptionDelete:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string, minLength: 1 }
    NotificationPreferencesUpdate:
      type: object
      required: [pushNotificationsEnabled]
      properties:
        pushNotificationsEnabled: { type: boolean }

    DevelopmentPerson:
      type: object
      required: [id, firstName, lastName, fullName]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }

    DevelopmentCycleInput:
      type: object
      required: [title, reportingPeriod, assessorIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        reportingPeriod: { type: string, minLength: 1, maxLength: 120 }
        assessorIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer }
        internalRecipientId: { type: ["integer", "null"] }

    DevelopmentRatings:
      type: object
      required: [technical, tactical, physical, coachabilityMindset, effortConsistency, teamworkCommunication, attendanceReliability]
      properties:
        technical: { type: integer, minimum: 1, maximum: 5 }
        tactical: { type: integer, minimum: 1, maximum: 5 }
        physical: { type: integer, minimum: 1, maximum: 5 }
        coachabilityMindset: { type: integer, minimum: 1, maximum: 5 }
        effortConsistency: { type: integer, minimum: 1, maximum: 5 }
        teamworkCommunication: { type: integer, minimum: 1, maximum: 5 }
        attendanceReliability: { type: integer, minimum: 1, maximum: 5 }

    DevelopmentAssessmentInput:
      allOf:
        - $ref: "#/components/schemas/DevelopmentRatings"
        - type: object
          required: [strength, focus]
          properties:
            strength: { type: string, minLength: 1, maxLength: 2000 }
            focus: { type: string, minLength: 1, maxLength: 2000 }
            internalNotes: { type: ["string", "null"], maxLength: 5000 }

    DevelopmentAssessment:
      allOf:
        - $ref: "#/components/schemas/DevelopmentAssessmentInput"
        - type: object
          required: [id, player, updatedBy, updatedAt]
          properties:
            id: { type: integer }
            player: { $ref: "#/components/schemas/DevelopmentPerson" }
            updatedBy: { $ref: "#/components/schemas/DevelopmentPerson" }
            updatedAt: { type: string }

    DevelopmentRubricCategory:
      type: object
      required: [key, label, description]
