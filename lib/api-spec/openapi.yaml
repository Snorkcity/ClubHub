        onBehalfOfPersonId: { type: integer }

    ExtraSession:
      type: object
      required: [id, personId, sessionDate, kind, rpe, minutes, load]
      properties:
        id: { type: integer }
        personId: { type: integer }
        sessionDate: { type: string }
        kind: { type: string, enum: [rep, school, gym, athletics, other] }
        label: { type: string, nullable: true }
        surface: { type: string, nullable: true }
        rpe: { type: integer }
        minutes: { type: integer }
        load: { type: integer }

    ExtraSessionInput:
      type: object
      required: [sessionDate, kind, rpe, minutes]
      properties:
        sessionDate: { type: string }
        kind: { type: string, enum: [rep, school, gym, athletics, other] }
        label: { type: string, maxLength: 120 }
        surface: { type: string, maxLength: 60 }
        rpe: { type: integer, minimum: 0, maximum: 10 }
        minutes: { type: integer, minimum: 1, maximum: 300 }
        onBehalfOfPersonId: { type: integer }

    PendingRpe:
      type: object
      required: [event, defaultMinutes]
      properties:
        event:
          $ref: "#/components/schemas/Event"
        defaultMinutes: { type: integer }

    CheckinSubject:
      type: object
      required: [person, isSelf, pendingRpe, weekWellness]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        isSelf: { type: boolean }
        todayWellness:
          $ref: "#/components/schemas/WellnessEntry"
        pendingRpe:
          type: array
          items:
            $ref: "#/components/schemas/PendingRpe"
        weekWellness:
          type: array
          items:
            $ref: "#/components/schemas/WellnessEntry"
        recentExtraSessions:
          type: array
          items:
            $ref: "#/components/schemas/ExtraSession"

    CheckinStatus:
      type: object
      required: [subjects]
      properties:
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/CheckinSubject"

    MonitoringFlag:
      type: object
      required: [metric, severity, message]
      properties:
        metric: { type: string }
        severity: { type: string, enum: [watch, alert] }
        message: { type: string }

    PlayerMonitoring:
      type: object
      required: [person, wellnessCount, sessions, windowLoad, flags, externalSessions]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        sleepQuality: { type: number, nullable: true }
        energy: { type: number, nullable: true }
        soreness: { type: number, nullable: true }
        stress: { type: number, nullable: true }
        mood: { type: number, nullable: true }
        wellnessComposite: { type: number, nullable: true }
        wellnessBaseline: { type: number, nullable: true }
        wellnessCount: { type: integer }
        lastWellnessDate: { type: string, nullable: true }
        sessions: { type: integer }
        windowLoad: { type: integer }
        windowExternalLoad: { type: integer }
        acuteLoad: { type: integer }
        acuteExternalLoad: { type: integer }
        chronicWeeklyLoad: { type: number, nullable: true }
        acwr: { type: number, nullable: true }
        flags:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringFlag"
        externalSessions:
          type: array
          description: Outside-club sessions logged by this player in the last 28 days, newest first.
          items:
            $ref: "#/components/schemas/ExtraSession"
        weeklyHistory:
          type: array
          description: Last 4 weeks, oldest first.
          items:
            $ref: "#/components/schemas/WeeklyHistory"

    WeeklyHistory:
      type: object
      required: [weekStart, load, externalLoad, sessions, checkIns]
      properties:
        weekStart: { type: string }
        load: { type: integer }
        externalLoad: { type: integer }
        sessions: { type: integer }
        wellnessAvg: { type: number, nullable: true }
        checkIns: { type: integer }

    TeamMonitoring:
      type: object
      required: [teamId, windowDays, generatedAt, players]
      properties:
        teamId: { type: integer }
        windowDays: { type: integer }
        generatedAt: { type: string }
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerMonitoring"

    GamePeriod:
      type: object
      required: [periodNumber, startedAt]
      properties:
        periodNumber: { type: integer }
        startedAt: { type: string }
        endedAt: { type: string, nullable: true }
        plannedMinutes: { type: integer, nullable: true }

    StartPeriodInput:
      type: object
      properties:
        plannedMinutes: { type: integer, nullable: true, minimum: 1, maximum: 120 }

    TimekeepingPlayer:
      type: object
      required: [person, onPitch, secondsPlayed]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        jerseyNumber: { type: integer, nullable: true }
        position: { type: string, nullable: true }
        onPitch: { type: boolean }
        secondsPlayed: { type: integer }
        rsvpStatus:
          type: string
          enum: [going, maybe, out]
          nullable: true

    TimekeepingState:
      type: object
      required: [clockRunning, periodsPlayed, periods, players]
      properties:
        clockRunning: { type: boolean }
        currentPeriodNumber: { type: integer, nullable: true }
        periodsPlayed: { type: integer }
        periods:
          type: array
          items:
            $ref: "#/components/schemas/GamePeriod"
        players:
          type: array
          items:
            $ref: "#/components/schemas/TimekeepingPlayer"

    SeasonMinutesPlayer:
      type: object
      required: [person, totalSeconds, gamesPlayed]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        jerseyNumber: { type: integer, nullable: true }
        position: { type: string, nullable: true }
        totalSeconds: { type: integer }
        gamesPlayed: { type: integer }

    SeasonMinutes:
      type: object
      required: [trackedGames, players]
      properties:
        trackedGames: { type: integer }
        players:
          type: array
          items:
            $ref: "#/components/schemas/SeasonMinutesPlayer"
