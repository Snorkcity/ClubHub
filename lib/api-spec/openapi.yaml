    TeamUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        ageGroup: { type: string, minLength: 1 }
        gender: { type: string }
        colorHex: { type: string }
        seasonId: { type: integer }

    TeamBannerInput:
      type: object
      required: [imageData]
      properties:
        imageData:
          type: string
