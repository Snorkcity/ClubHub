          items: { $ref: "#/components/schemas/ChatMemberRead" }

    Message:
      type: object
      required: [id, chatId, body, createdAt, author]
      properties:
        id: { type: integer }
        chatId: { type: integer }
        body: { type: string }
        createdAt: { type: string }
        author: { $ref: "#/components/schemas/Person" }

    ClubOverview:
      type: object
      required: [club, teamCount, playerCount, coachCount, parentCount, upcomingEvents, recentPosts]
      properties:
        club: { $ref: "#/components/schemas/Club" }
        teamCount: { type: integer }
        playerCount: { type: integer }
        coachCount: { type: integer }
        parentCount: { type: integer }
        upcomingEvents:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        recentPosts:
          type: array
          items: { $ref: "#/components/schemas/Post" }

    ClubStorage:
      type: object
