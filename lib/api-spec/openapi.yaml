    ExtraSession:
      type: object
      required: [id, personId, sessionDate, kind, rpe, minutes, load]
      properties:
        id: { type: integer }
        personId: { type: integer }
        sessionDate: { type: string }
        kind: { type: string, enum: [rep, school, other] }
        label: { type: string, nullable: true }
        rpe: { type: integer }
        minutes: { type: integer }
        load: { type: integer }

    ExtraSessionInput:
      type: object
      required: [sessionDate, kind, rpe, minutes]
      properties:
