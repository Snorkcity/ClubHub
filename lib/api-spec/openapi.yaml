openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ClubHub API — multi-team soccer club management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current user identity and access
  - name: club
    description: Club-level data and overview
  - name: teams
    description: Teams, seasons, and rosters
  - name: people
    description: People, memberships, and family links
  - name: feed
    description: Team posts and comments
  - name: events
    description: Scheduling and availability
  - name: timekeeping
    description: Game-time (player minutes) tracking
  - name: chats
    description: Messaging

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Current signed-in user with roles, memberships and family links
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
    patch:
      operationId: updateMe
      tags: [me]
      summary: Update the current user's own profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"

  /me/event-locations:
    get:
      operationId: listMyEventLocations
      tags: [me]
      summary: Recently used event locations across teams the user staffs
      responses:
        "200":
          description: Distinct locations, most recent first
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /club:
    get:
      operationId: getClub
      tags: [club]
      summary: Get the current club
      responses:
        "200":
          description: Club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"

  /club/overview:
    get:
      operationId: getClubOverview
      tags: [club]
      summary: Club-wide dashboard overview (admin)
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubOverview"

  /seasons:
    get:
      operationId: listSeasons
      tags: [teams]
      summary: List seasons
      responses:
        "200":
          description: Seasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Season"

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List teams visible to the current user
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{teamId}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a team
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{teamId}/summary:
    get:
      operationId: getTeamSummary
      tags: [teams]
      summary: Team dashboard summary (next event, availability, recent activity)
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Team summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSummary"

  /teams/{teamId}/members:
    get:
      operationId: listTeamMembers
      tags: [teams]
      summary: List members of a team
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: addTeamMember
      tags: [teams]
      summary: Add a person to a team with a role
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"

  /team-members/{memberId}:
    patch:
      operationId: updateTeamMember
      tags: [teams]
      summary: Update a team membership (role, number, position)
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove a person from a team
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"

  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List all people in the club
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [manager, coach, player, parent]
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      operationId: createPerson
      tags: [people]
      summary: Create a person (player, parent, coach or manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"

  /people/{personId}:
    get:
      operationId: getPerson
      tags: [people]
      summary: Get a person's full profile with memberships and family links
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Person detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Update a person's profile
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          $ref: "#/components/responses/NotFound"

  /guardianships:
    post:
      operationId: createGuardianship
      tags: [people]
      summary: Link a guardian to a player's lifelong account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardianshipInput"
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guardianship"

  /guardianships/{guardianshipId}:
    delete:
      operationId: removeGuardianship
      tags: [people]
      summary: Remove a family link
      parameters:
        - $ref: "#/components/parameters/GuardianshipId"
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"

  /unreads:
    get:
      operationId: listTeamUnreads
      tags: [feed]
      summary: Unread post/message counts per team for the current user
      responses:
        "200":
          description: Unread counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamUnread"

  /teams/{teamId}/seen:
    post:
      operationId: markTeamSeen
      tags: [feed]
      summary: Mark a team's content as seen up to now
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "204":
          description: Marked seen

  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Aggregated recent posts across the user's teams
      responses:
        "200":
          description: Feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /teams/{teamId}/posts:
    get:
      operationId: listTeamPosts
      tags: [feed]
      summary: List posts for a team
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [feed]
      summary: Post to a team
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{postId}:
    get:
      operationId: getPost
      tags: [feed]
      summary: Get a post with its comments
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePost
      tags: [feed]
      summary: Edit or pin a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePost
      tags: [feed]
      summary: Delete a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{postId}/comments:
    post:
      operationId: addComment
      tags: [feed]
      summary: Comment on a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /events/upcoming:
    get:
      operationId: listUpcomingEvents
      tags: [events]
      summary: Upcoming events across the user's teams
      responses:
        "200":
          description: Upcoming events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /teams/{teamId}/events:
    get:
      operationId: listTeamEvents
      tags: [events]
      summary: List events for a team
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Schedule a training, game or event
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{eventId}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event with availability detail
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /events/{eventId}/rsvp:
    put:
      operationId: setRsvp
      tags: [events]
      summary: Set availability for an event (self or on behalf of a linked player)
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpInput"
      responses:
        "200":
          description: RSVP saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rsvp"

  /chats:
    get:
      operationId: listChats
      tags: [chats]
      summary: List chats for the current user
      responses:
        "200":
          description: Chats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chat"
    post:
      operationId: createChat
      tags: [chats]
      summary: Start a new chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"

  /chats/{chatId}:
    get:
      operationId: getChat
      tags: [chats]
      summary: Get a chat with its members
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: Chat detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /chats/{chatId}/messages:
    get:
      operationId: listMessages
      tags: [chats]
      summary: List messages in a chat
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [chats]
      summary: Send a message
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /chats/{chatId}/read:
    post:
      operationId: markChatRead
      tags: [chats]
      summary: Mark a chat as read up to now (read receipts)
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "204":
          description: Marked read

  /monitoring/checkin:
    get:
      operationId: getCheckinStatus
      tags: [monitoring]
      summary: Wellness/RPE check-in status for the current user and their linked players
      parameters:
        - name: date
          in: query
          required: true
          description: The local calendar date to check in for (YYYY-MM-DD)
          schema:
            type: string
      responses:
        "200":
          description: Check-in subjects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinStatus"

  /wellness:
    put:
      operationId: submitWellness
      tags: [monitoring]
      summary: Submit the daily wellness check (self or on behalf of a linked player)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WellnessInput"
      responses:
        "200":
          description: Wellness entry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellnessEntry"

  /events/{eventId}/rpe:
    put:
      operationId: submitRpe
      tags: [monitoring]
      summary: Submit post-session RPE for an event (self or on behalf of a linked player)
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RpeInput"
      responses:
        "200":
          description: RPE entry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpeEntry"

  /extra-sessions:
    post:
      operationId: logExtraSession
      tags: [monitoring]
      summary: Log a session outside the club calendar (rep, school, other)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtraSessionInput"
      responses:
        "200":
          description: Extra session saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtraSession"

  /extra-sessions/{extraSessionId}:
    delete:
      operationId: deleteExtraSession
      tags: [monitoring]
      summary: Delete an extra session you logged
      parameters:
        - name: extraSessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /teams/{teamId}/monitoring:
    get:
      operationId: getTeamMonitoring
      tags: [monitoring]
      summary: Live player-monitoring dashboard for a team (staff only)
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: window
          in: query
          required: false
          description: Window in days (1, 7, 14 or 28); defaults to 7
          schema:
            type: integer
      responses:
        "200":
          description: Team monitoring snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMonitoring"

  /events/{eventId}/timekeeping:
    get:
      operationId: getTimekeeping
      tags: [timekeeping]
      summary: Live game-time tracking state for a game (staff only)
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Timekeeping state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimekeepingState"

  /events/{eventId}/timekeeping/periods/start:
    post:
      operationId: startPeriod
      tags: [timekeeping]
      summary: Start the next period (half) of the game clock (staff only)
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPeriodInput"
      responses:
        "200":
          description: Updated timekeeping state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimekeepingState"

  /events/{eventId}/timekeeping/periods/end:
    post:
      operationId: endPeriod
      tags: [timekeeping]
      summary: End the running period (half) of the game clock (staff only)
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Updated timekeeping state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimekeepingState"

  /events/{eventId}/timekeeping/players/{userId}/toggle:
    post:
      operationId: togglePlayerOnPitch
      tags: [timekeeping]
      summary: Toggle a player ON/OFF the pitch (staff only)
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated timekeeping state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimekeepingState"

  /teams/{teamId}/timekeeping/season:
    get:
      operationId: getSeasonMinutes
      tags: [timekeeping]
      summary: Season game-minutes totals per player (staff only)
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Season minutes summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonMinutes"

components:
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: integer
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: integer
    GuardianshipId:
      name: guardianshipId
      in: path
      required: true
      schema:
        type: integer
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: integer

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Person:
      type: object
      required: [id, firstName, lastName, fullName, isMinor]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        phonePrivacy: { type: string, enum: [everyone, admins, private] }
        emailPrivacy: { type: string, enum: [everyone, admins, private] }
        bioPrivacy: { type: string, enum: [everyone, admins, private] }
        dateOfBirth: { type: ["string", "null"] }
        isMinor: { type: boolean }
        hasLogin: { type: boolean }

    Club:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        logoUrl: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }

