        lastName: { type: string, minLength: 1 }
        phone: { type: string }
        avatarUrl: { type: string }
        bio: { type: string }
        phonePrivacy: { type: string, enum: [everyone, admins, private] }
        emailPrivacy: { type: string, enum: [everyone, admins, private] }
        bioPrivacy: { type: string, enum: [everyone, admins, private] }

    TeamInput:
      type: object
      required: [name, ageGroup]
      properties:
        name: { type: string, minLength: 1 }
        ageGroup: { type: string, minLength: 1 }
        gender: { type: string }
        colorHex: { type: string }
        seasonId: { type: integer }
        countryCode:
