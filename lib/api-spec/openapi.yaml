                $ref: "#/components/schemas/TeamMonitoring"

  /events/{eventId}/timekeeping:
    get:
      operationId: getTimekeeping
      tags: [timekeeping]
      summary: Live game-time tracking state for a game (staff only)
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Timekeeping state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimekeepingState"

  /events/{eventId}/timekeeping/periods/start:
    post:
      operationId: startPeriod
      tags: [timekeeping]
      summary: Start the next period (half) of the game clock (staff only)
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPeriodInput"
      responses:
        "200":
          description: Updated timekeeping state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimekeepingState"

  /events/{eventId}/timekeeping/periods/end:
    post:
      operationId: endPeriod
      tags: [timekeeping]
      summary: End the running period (half) of the game clock (staff only)
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Updated timekeeping state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimekeepingState"

  /events/{eventId}/timekeeping/players/{userId}/toggle:
    post:
      operationId: togglePlayerOnPitch
      tags: [timekeeping]
      summary: Toggle a player ON/OFF the pitch (staff only)
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated timekeeping state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimekeepingState"

  /teams/{teamId}/timekeeping/season:
    get:
      operationId: getSeasonMinutes
      tags: [timekeeping]
      summary: Season game-minutes totals per player (staff only)
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Season minutes summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonMinutes"

components:
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: integer
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: integer
    GuardianshipId:
      name: guardianshipId
      in: path
      required: true
      schema:
        type: integer
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: integer

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Notification:
      type: object
      required: [id, kind, title, body, deepLink, createdAt, readAt, unread]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [event, post] }
        title: { type: string }
        body: { type: string }
        deepLink: { type: string }
        createdAt: { type: string }
        readAt: { type: ["string", "null"] }
        unread: { type: boolean }
    NotificationList:
      type: object
      required: [unreadCount, hasMore, nextCursor, notifications]
      properties:
        unreadCount: { type: integer }
        hasMore: { type: boolean }
        nextCursor: { type: ["integer", "null"] }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
    PushConfig:
      type: object
      required: [enabled, publicKey]
      properties:
        enabled: { type: boolean }
        publicKey: { type: ["string", "null"] }
    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, minLength: 1 }
        contentEncoding: { type: string }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 1 }
            auth: { type: string, minLength: 1 }
    PushSubscriptionDelete:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string, minLength: 1 }
    NotificationPreferencesUpdate:
      type: object
      required: [pushNotificationsEnabled]
      properties:
        pushNotificationsEnabled: { type: boolean }

    Person:
      type: object
      required: [id, firstName, lastName, fullName, isMinor]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        phonePrivacy: { type: string, enum: [everyone, admins, private] }
        emailPrivacy: { type: string, enum: [everyone, admins, private] }
        bioPrivacy: { type: string, enum: [everyone, admins, private] }
        dateOfBirth: { type: ["string", "null"] }
        isMinor: { type: boolean }
        hasLogin: { type: boolean }

    TeamMemberPerson:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          required: [teamRoles, connectedChildren]
          properties:
            teamRoles:
              type: array
              items:
                type: string
                enum: [manager, coach, player]
            connectedChildren:
              type: array
              items:
                $ref: "#/components/schemas/ConnectedChild"

    ConnectedChild:
      type: object
      required: [id, fullName]
      properties:
        id: { type: integer }
        fullName: { type: string }

    Club:
      type: object
      required: [id, name, countryCode]
      properties:
        id: { type: integer }
        name: { type: string }
        logoUrl: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }
        countryCode:
          type: string
          enum: [AU, NZ, GB, US, CA]

    Season:
      type: object
      required: [id, name, isActive]
      properties:
        id: { type: integer }
        name: { type: string }
        startDate: { type: ["string", "null"] }
        endDate: { type: ["string", "null"] }
        isActive: { type: boolean }

    Team:
      type: object
      required: [id, name, ageGroup, playerCount, staffCount]
      properties:
        id: { type: integer }
        name: { type: string }
        ageGroup: { type: string }
        gender: { type: ["string", "null"] }
        colorHex: { type: ["string", "null"] }
        seasonId: { type: ["integer", "null"] }
        seasonName: { type: ["string", "null"] }
        playerCount: { type: integer }
        staffCount: { type: integer }
        bannerUpdatedAt: { type: ["string", "null"] }
        bannerUrl:
          type: ["string", "null"]
          description: Signed, expiring relative URL for the team banner image


    TeamSummary:
      type: object
      required: [team, playerCount, goingCount, maybeCount, outCount, noResponseCount, recentPostCount]
      properties:
        team: { $ref: "#/components/schemas/Team" }
        nextEvent: { $ref: "#/components/schemas/Event" }
        playerCount: { type: integer }
        goingCount: { type: integer }
        maybeCount: { type: integer }
        outCount: { type: integer }
        noResponseCount: { type: integer }
        recentPostCount: { type: integer }

    TeamMembership:
      type: object
      required: [id, teamId, teamName, role]
      properties:
        id: { type: integer }
        teamId: { type: integer }
        teamName: { type: string }
        role: { type: string, enum: [manager, coach, player] }
        jerseyNumber: { type: ["integer", "null"] }
        position: { type: ["string", "null"] }

    TeamMember:
      type: object
      required: [id, teamId, role, person]
      properties:
        id: { type: integer }
        teamId: { type: integer }
        role: { type: string, enum: [manager, coach, player] }
        jerseyNumber: { type: ["integer", "null"] }
        position: { type: ["string", "null"] }
        person: { $ref: "#/components/schemas/Person" }

    Guardianship:
      type: object
      required: [id, relationship, canManage, guardian, player]
      properties:
        id: { type: integer }
        relationship: { type: string, enum: [parent, guardian, other] }
        canManage: { type: boolean }
        guardian: { $ref: "#/components/schemas/Person" }
        player: { $ref: "#/components/schemas/Person" }

    CurrentUser:
      type: object
      required: [person, isClubAdmin, memberships, guardianOf, pushNotificationsEnabled]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        clubRole: { type: ["string", "null"], enum: [admin, member, null] }
        isClubAdmin: { type: boolean }
        pushNotificationsEnabled: { type: boolean }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/TeamMembership" }
        guardianOf:
          type: array
          items: { $ref: "#/components/schemas/Person" }

    PersonDetail:
      type: object
      required: [person, memberships, guardians, wards]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/TeamMembership" }
        guardians:
          type: array
          items: { $ref: "#/components/schemas/Guardianship" }
        wards:
          type: array
          items: { $ref: "#/components/schemas/Guardianship" }

    Post:
      type: object
      required: [id, teamId, teamName, body, pinned, createdAt, author, commentCount]
      properties:
        id: { type: integer }
        teamId: { type: integer }
        teamName: { type: string }
        title: { type: ["string", "null"] }
        body: { type: string }
        pinned: { type: boolean }
        createdAt: { type: string }
        author: { $ref: "#/components/schemas/Person" }
        commentCount: { type: integer }
        photos:
          type: array
          items: { $ref: "#/components/schemas/PostPhoto" }

    PostPhoto:
      type: object
      required: [id, url]
      properties:
        id: { type: integer }
        url:
          type: string
          description: Signed, expiring relative URL for the photo

    PostDetail:
      type: object
      required: [post, comments]
      properties:
        post: { $ref: "#/components/schemas/Post" }
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }

    Comment:
      type: object
      required: [id, postId, body, createdAt, author]
      properties:
        id: { type: integer }
        postId: { type: integer }
        body: { type: string }
        createdAt: { type: string }
        author: { $ref: "#/components/schemas/Person" }

    Event:
      type: object
      required: [id, teamId, teamName, type, title, startsAt, goingCount, maybeCount, outCount, noResponseCount]
      properties:
        id: { type: integer }
        teamId: { type: integer }
        teamName: { type: string }
        type: { type: string, enum: [training, game, social, other] }
        title: { type: string }
        location: { type: ["string", "null"] }
        opponent: { type: ["string", "null"] }
        startsAt: { type: string }
        endsAt: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        goingCount: { type: integer }
        maybeCount: { type: integer }
        outCount: { type: integer }
        noResponseCount: { type: integer }
        myRsvp: { type: ["string", "null"], enum: [going, maybe, out, null] }
        invitedRoles:
          type: array
          items: { type: string, enum: [coaches, players, parents] }
        cancelledAt: { type: ["string", "null"] }
        cancelReason: { type: ["string", "null"] }

    EventDetail:
      type: object
      required: [event, rsvps]
      properties:
        event: { $ref: "#/components/schemas/Event" }
        rsvps:
          type: array
          items: { $ref: "#/components/schemas/Rsvp" }
        teamPlayerCount: { type: integer }
        teamStaffCount: { type: integer }

    Rsvp:
      type: object
      required: [id, eventId, status, person]
