      properties:
        status:
          type: string
          enum: [ok, warning, critical]
        postPhotos:
          type: object
          required: [bytes, count]
          properties:
            bytes: { type: integer }
            count: { type: integer }
        bannersBytes: { type: integer }
        databaseBytes: { type: integer }
        thresholds:
          type: object
          required: [warnBytes, criticalBytes]
          properties:
            warnBytes: { type: integer }
            criticalBytes: { type: integer }
        plan: { type: string }

    ProfileUpdate:
