        eventId: { type: integer }
        status: { type: string, enum: [going, maybe, out] }
        reason: { type: ["string", "null"] }
        respondedAt: { type: ["string", "null"] }
        role: { type: ["string", "null"], enum: [manager, coach, player, null] }
        person: { $ref: "#/components/schemas/Person" }

    Chat:
      type: object
      required: [id, name, type, memberCount]
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string, enum: [team, group, direct] }
        teamId: { type: ["integer", "null"] }
        teamName: { type: ["string", "null"] }
        memberCount: { type: integer }
        lastMessage: { $ref: "#/components/schemas/Message" }
        myLastReadAt: { type: ["string", "null"] }

    ChatMemberRead:
      type: object
      required: [userId]
      properties:
        userId: { type: integer }
        lastReadAt: { type: ["string", "null"] }

    ChatDetail:
      type: object
      required: [chat, members, reads]
      properties:
        chat: { $ref: "#/components/schemas/Chat" }
        members:
