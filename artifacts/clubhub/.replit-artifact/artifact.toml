kind = "web"
previewPath = "/"
title = "ClubHub"
version = "1.0.0"
id = "artifacts/clubhub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22122

[services.development]
run = "pnpm --filter @workspace/clubhub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clubhub", "run", "build" ]
serve = "static"
publicDir = "artifacts/clubhub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22122"
BASE_PATH = "/"
